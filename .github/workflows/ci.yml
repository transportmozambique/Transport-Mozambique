# Verifica cada pull request e cada push para a main: os tipos das três aplicações, as três cópias
# do esquema Prisma iguais, e as ligações, âncoras e navegação da documentação.
# Os testes Jest e Playwright do painel precisam de uma cópia local da base de dados e correm-se à
# mão (docs/testes.md). Porquê só isto aqui: não precisa de segredos nem de base de dados, por isso
# corre em qualquer fork sem configuração.
name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Tipos (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [transport-client, transport-admin, transport-driver]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # Os tipos do cliente Prisma; o transport-driver não acede à base de dados
      - if: matrix.app != 'transport-driver'
        run: npx prisma generate
      - run: npx tsc --noEmit

  consistency:
    name: Esquemas e documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Os três esquemas Prisma são iguais
        run: node .github/scripts/check-schemas.mjs
      - name: As ligações e âncoras da documentação existem
        run: python3 .github/scripts/check-doc-links.py .
      - name: A navegação da documentação está actualizada
        run: python3 .github/scripts/docs-nav.py --check
      - name: Os termos técnicos da documentação estão ligados às suas explicações
        run: python3 .github/scripts/docs-termos.py --check
