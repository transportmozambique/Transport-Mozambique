# SMS de chegada sem tráfego na web. A verificação que envia SMS aos passageiros quando um
# autocarro está a menos de 1 km da sua paragem só corria enquanto alguém usava a aplicação web,
# por isso quem pedia por USSD a uma hora calma não recebia SMS. Isto chama-a a cada 5 minutos (o
# GitHub pode começar uma corrida agendada alguns minutos depois). Porquê o GitHub Actions e não um
# cron da Vercel: o plano Hobby da Vercel só permite cron jobs uma vez por dia.
# docs/fluxos-de-dados.md#alerta-de-chegada-e-sms
name: Verificação de chegadas (SMS)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/simulation {"action":"check"}
        run: |
          curl -fsS --max-time 60 -X POST https://transport-mz.vercel.app/api/simulation \
            -H "Content-Type: application/json" -d '{"action":"check"}' \
            | head -c 500
          echo
