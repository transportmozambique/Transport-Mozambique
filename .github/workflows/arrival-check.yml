# Os SMS de chegada e os avisos das viagens acompanhadas sem tráfego na web. A verificação que os
# envia corre também a cada visita à web, ao USSD e ao portal do motorista, mas a uma hora calma
# ninguém a dispararia. Isto pede-a a cada 5 minutos. Na prática o GitHub corre os agendamentos de
# um repositório público com grandes atrasos (em Outubro de 2026, a cada 40 a 50 minutos), por isso
# os avisos de 15, 10 e 5 minutos precisam também de um pedido agendado externo a cada minuto
# (o cronjob do cron-job.org, docs/guia-cron-job.md); este fica como reserva. Porquê
# não um cron da Vercel: o plano Hobby da Vercel só permite cron jobs uma vez por dia.
# docs/fluxos-de-dados.md#alerta-de-chegada-e-sms
name: Verificação de chegadas (SMS)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/simulation {"action":"check"}
        run: |
          curl -fsS --max-time 60 -X POST https://transport-mz.vercel.app/api/simulation \
            -H "Content-Type: application/json" -d '{"action":"check"}' \
            | head -c 500
          echo
